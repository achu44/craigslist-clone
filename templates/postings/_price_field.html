<div id="price-field-wrapper">
  {% if category.price_policy == "forbidden" %}
    <p>This category does not use pricing.</p>
    <input type="hidden" name="price" value="" />
  {% else %}
    <label for="id_price">Price{% if category.price_policy == "required" %} (required){% endif %}</label>
    <input
      type="number"
      step="0.01"
      min="0"
      name="price"
      id="id_price"
      {% if category.price_policy == "required" %}required{% endif %}
    />
  {% endif %}
</div>
